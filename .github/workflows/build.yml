name: Build Bitburner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          # Напрямую скачиваем command line tools и принимаем лицензии
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Init Bubblewrap config
        run: |
          # Создаем конфиг, чтобы Bubblewrap не пытался спрашивать пути в консоли
          mkdir -p $HOME/.bubblewrap
          echo '{"jdkPath":"/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.10-7/x64","androidSdkPath":"'"$HOME"'/android-sdk"}' > $HOME/.bubblewrap/config.json

      - name: Generate Android project from manifest
        run: |
          bubblewrap update --skipVersionUpgrade

      - name: Build APK
        run: |
          bubblewrap build \
            --signingKeyPath=android.keystore \
            --signingKeyAlias=${{ secrets.KEY_ALIAS }} \
            --keystorePassword=${{ secrets.KEYSTORE_PASSWORD }} \
            --keyPassword=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bitburner-apk
          path: '*.apk'