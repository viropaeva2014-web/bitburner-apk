name: Build Bitburner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          # Напрямую скачиваем command line tools и принимаем лицензии
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Init Bubblewrap config
        run: |
          # Создаем конфиг, чтобы Bubblewrap не пытался спрашивать пути в консоли
          mkdir -p $HOME/.bubblewrap
          echo '{"jdkPath":"/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.10-7/x64","androidSdkPath":"'"$HOME"'/android-sdk"}' > $HOME/.bubblewrap/config.json

      - name: Generate Android project from manifest
        run: |
          bubblewrap update --skipVersionUpgrade

- name: Generate Android project and Build APK
  run: |
    # 1. Генерируем проект (теперь у Bubblewrap есть все пути)
    bubblewrap init --manifest="https://bitburner-official.github.io/manifest.json" --directory=android-app
    
    # 2. Переходим в папку проекта
    cd android-app
    
    # 3. Настраиваем ключи для подписи (передаем их напрямую в Gradle)
    echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
    echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
    echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
    echo "storeFile=../android.keystore" >> keystore.properties
    
    # 4. Собираем релизный APK
    ./gradlew assembleRelease
    
    # 5. Копируем готовый APK в корень для загрузки
    cp app/build/outputs/apk/release/app-release-signed.apk ../bitburner.apk || cp app/build/outputs/apk/release/app-release.apk ../bitburner.apk

- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: bitburner-apk
    path: bitburner.apk